[project]
name = "a-share-turnover-factor"
version = "0.1.0"
description = "A-share turnover-rate factor backtest with Tushare daily data."
requires-python = ">=3.9"
dependencies = [
  "tushare>=1.2.89",
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
a-share-turnover-factor = "a_share_turnover_factor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
